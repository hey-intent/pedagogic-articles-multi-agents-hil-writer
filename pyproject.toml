[project]
name = "pedagogical-article-writer"
version = "0.1.0"
description = "LangGraph reference implementation demonstrating multi-agent patterns"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.6",
    "langgraph-api>=0.0.32",
    "langgraph-cli>=0.1.0",
    "langchain-core>=1.2.7",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic-settings>=2.12.0",
]


[project.scripts]
article-writer = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
dev-dependencies = []

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
